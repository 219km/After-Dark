<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Said It? | AFTER DARK</title>
<link rel="stylesheet" href="style.css">

<style>
.quote-container {
  max-width: 650px;
  margin: 30px auto;
  padding: 20px;
  text-align: center;
}

.quote-container h2 {
  color: #ff3030;
  letter-spacing: 3px;
}

.quote-box {
  background: #111;
  border: 1px solid #444;
  border-radius: 15px;
  padding: 25px 18px;
  margin-top: 20px;
}

#quote {
  font-size: 21px;
  line-height: 1.6;
  margin: 30px 0;
}

#answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.answer {
  background: #202020;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 14px 8px;
  cursor: pointer;
}

.answer:hover:not(:disabled) {
  background: #ff3030;
}

.answer:disabled {
  opacity: .6;
}

.difficulty {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.difficulty button, #next, #restart {
  background: #ff3030;
  color: white;
  border: none;
  padding: 12px 16px;
  border-radius: 7px;
  cursor: pointer;
}

#feedback {
  min-height: 25px;
  margin: 20px 0;
  font-weight: bold;
}

.stats {
  color: #ff5555;
  font-weight: bold;
}

.back {
  display: inline-block;
  margin: 25px;
  color: #ff5555;
  text-decoration: none;
}

@media(max-width:400px) {
  #answers {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>AFTER DARK</h1>
  <p>JUJUTSU KAISEN ARCADE</p>
</header>

<main class="quote-container">

<h2>WHO SAID IT?</h2>
<p>CAN YOU RECOGNIZE THE VOICE?</p>

<div class="difficulty">
  <button onclick="setDifficulty('easy')">EASY</button>
  <button onclick="setDifficulty('medium')">MEDIUM</button>
  <button onclick="setDifficulty('nightmare')">NIGHTMARE</button>
</div>

<div class="quote-box">

  <p id="level">EASY MODE</p>

  <h3 id="quote">WHO SAID THIS?</h3>

  <div id="answers"></div>

  <p id="feedback"></p>

  <p class="stats" id="score">SCORE: 0</p>
  <p class="stats" id="streak">STREAK: 0</p>
  <p class="stats" id="credits">CREDITS: 0</p>

  <button id="next" onclick="nextQuestion()" style="display:none;">
    NEXT QUOTE
  </button>

  <button id="restart" onclick="restartGame()" style="display:none;">
    PLAY AGAIN
  </button>

</div>

<a class="back" href="arcade.html">← BACK TO ARCADE</a>

</main>

<script>
const questions = {
  easy: [
    {
      quote: "I'm the strongest.",
      answers: ["Gojo", "Yuji", "Megumi", "Nanami"],
      correct: 0
    },
    {
      quote: "I'll eat anything.",
      answers: ["Geto", "Yuji", "Sukuna", "Toji"],
      correct: 1
    },
    {
      quote: "With this treasure, I summon...",
      answers: ["Gojo", "Nobara", "Megumi", "Yuta"],
      correct: 2
    },
    {
      quote: "I don't care about the others.",
      answers: ["Maki", "Megumi", "Yuji", "Panda"],
      correct: 1
    }
  ],

  medium: [
    {
      quote: "Work is shit.",
      answers: ["Gojo", "Nanami", "Geto", "Todo"],
      correct: 1
    },
    {
      quote: "Are you my type of woman?",
      answers: ["Yuji", "Todo", "Gojo", "Choso"],
      correct: 1
    },
    {
      quote: "Love is the most twisted curse of all.",
      answers: ["Geto", "Gojo", "Yuta", "Sukuna"],
      correct: 0
    },
    {
      quote: "I'm you.",
      answers: ["Mahito", "Yuji", "Sukuna", "Choso"],
      correct: 1
    }
  ],

  nightmare: [
    {
      quote: "Throughout heaven and earth, I alone am the honored one.",
      answers: ["Sukuna", "Gojo", "Geto", "Yuta"],
      correct: 1
    },
    {
      quote: "If I'm going to be killed anyway, I might as well live my life freely.",
      answers: ["Toji", "Geto", "Nanami", "Megumi"],
      correct: 0
    },
    {
      quote: "I want to be a good person.",
      answers: ["Junpei", "Yuji", "Yuta", "Choso"],
      correct: 0
    },
    {
      quote: "I have no regrets about the way I lived.",
      answers: ["Nanami", "Gojo", "Toji", "Geto"],
      correct: 2
    }
  ]
};

let difficulty = "easy";
let current = 0;
let score = 0;
let streak = 0;
let credits = 0;
let answered = false;

function setDifficulty(level) {
  difficulty = level;
  restartGame();
}

function loadQuestion() {
  const list = questions[difficulty];

  if (current >= list.length) {
    endGame();
    return;
  }

  answered = false;

  document.getElementById("level").textContent =
    difficulty.toUpperCase() + " MODE";

  document.getElementById("quote").textContent =
    '"' + list[current].quote + '"';

  document.getElementById("answers").innerHTML = "";

  document.getElementById("feedback").textContent = "";
  document.getElementById("next").style.display = "none";
  document.getElementById("restart").style.display = "none";

  list[current].answers.forEach((answer, index) => {
    const button = document.createElement("button");

    button.className = "answer";
    button.textContent = answer;

    button.onclick = () => checkAnswer(index);

    document.getElementById("answers").appendChild(button);
  });

  updateStats();
}

function checkAnswer(selected) {
  if (answered) return;

  answered = true;

  const question = questions[difficulty][current];
  const buttons = document.querySelectorAll(".answer");

  buttons.forEach(button => button.disabled = true);

  if (selected === question.correct) {
    score += difficulty === "easy" ? 100 :
             difficulty === "medium" ? 200 : 500;

    streak++;
    credits += difficulty === "easy" ? 5 :
               difficulty === "medium" ? 10 : 25;

    document.getElementById("feedback").textContent =
      "CORRECT! YOU KNOW YOUR JJK!";
  } else {
    streak = 0;

    document.getElementById("feedback").textContent =
      "WRONG! ANSWER: " + question.answers[question.correct];
  }

  updateStats();

  if (current === questions[difficulty].length - 1) {
    document.getElementById("next").textContent = "SEE RESULTS";
  } else {
    document.getElementById("next").textContent = "NEXT QUOTE";
  }

  document.getElementById("next").style.display = "inline-block";
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function updateStats() {
  document.getElementById("score").textContent = "SCORE: " + score;
  document.getElementById("streak").textContent = "STREAK: " + streak;
  document.getElementById("credits").textContent = "CREDITS: " + credits;
}

function endGame() {
  document.getElementById("quote").textContent = "GAME COMPLETE!";
  document.getElementById("answers").innerHTML =
    "<h3>FINAL SCORE: " + score + "</h3>";

  document.getElementById("feedback").textContent =
    "YOU COMPLETED " + difficulty.toUpperCase() + " MODE!";

  document.getElementById("next").style.display = "none";
  document.getElementById("restart").style.display = "inline-block";
}

function restartGame() {
  current = 0;
  score = 0;
  streak = 0;
  credits = 0;

  document.getElementById("next").textContent = "NEXT QUOTE";

  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
